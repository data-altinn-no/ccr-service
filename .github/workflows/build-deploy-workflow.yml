name: Deploy CcrService

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/README.md'
      - '**/*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    uses: data-altinn-no/deploy-actions/.github/workflows/dan-noslots-deploy-flow.yml@009dae7d9c3f0ddab3c1be13fe0c76177e174d74
    with:
      artifact_name: 'dan-ccr-wrapper' # Can be omitted, defaults to 'artifact'
      function_project_path: 'src/Dan.CcrService'
      dotnet_version: '10.0.x'
    secrets:
      function_app_name: ${{ secrets.CCRSERVICE_FUNCTIONAPP_NAME }}
      publish_profile: ${{ secrets.CCRSERVICE_AZURE_FUNCTION_PUBLISH_CREDS }}
